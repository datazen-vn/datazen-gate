name: Feature request
description: A capability that is missing or could work better.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What the user is trying to do, in their words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know it is done.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
