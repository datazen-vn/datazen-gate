name: Bug report
description: Something does not work as documented.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Development, staging or production; browser or runtime version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets, tokens and personal data before pasting.
      render: text
