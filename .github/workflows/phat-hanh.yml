# Phát hành: đẩy tag `v*` ⇒ build dz-gate cho linux/darwin x amd64/arm64, ghi SHA256SUMS, tạo GitHub release.
# Tên tệp: dz-gate_<phiên bản>_<os>_<arch>.tar.gz (trong có `dz-gate`, LICENSE, README.md).
name: phat-hanh

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  phat-hanh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build các bản
        run: |
          set -euo pipefail
          phien_ban="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              ten="dz-gate_${phien_ban}_${os}_${arch}"
              mkdir -p "dist/${ten}"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-s -w -X main.phienBan=${phien_ban}" \
                -o "dist/${ten}/dz-gate" ./cmd/dz-gate
              cp LICENSE README.md "dist/${ten}/"
              tar -C dist -czf "dist/${ten}.tar.gz" "$ten"
              rm -rf "dist/${ten}"
            done
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: kiểm bản linux/amd64 báo đúng phiên bản
        run: |
          set -euo pipefail
          phien_ban="${GITHUB_REF_NAME#v}"
          tar -xzf "dist/dz-gate_${phien_ban}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          out="$("$RUNNER_TEMP/dz-gate_${phien_ban}_linux_amd64/dz-gate" --version)"
          [ "$out" = "dz-gate ${phien_ban}" ] || { echo "phiên bản sai: $out"; exit 1; }

      - name: tạo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          co_gach=""; case "$GITHUB_REF_NAME" in *-*) co_gach="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "dz-gate ${GITHUB_REF_NAME}" --generate-notes $co_gach
